<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>酒日記 | Sake Log</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0E0F1A">
  <!-- D3.js for Japan Map -> City Drilldown -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg-base: #0E0F1A;
      --bg-surface: #1A2B3A;
      --border-muted: #3C4554;
      --accent-plum: #7A3E5A;
      --accent-gold: #C9A36A;
      --danger-red: #B83A4B;
      --text-main: #F3F4F6;
      --text-sub: #A3B1C2;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.5;
      padding-bottom: 84px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(14, 15, 26, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-muted);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      font-weight: bold;
      font-size: 14px;
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--border-muted);
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent-plum);
      border-color: var(--accent-gold);
      color: #FFF;
    }

    .btn-gold {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: var(--bg-base);
    }

    .btn-danger {
      background: rgba(184, 58, 75, 0.2);
      border-color: var(--danger-red);
      color: #FF8A98;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Container & Views */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    /* Bottom Navigation (Page Switcher) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(14, 15, 26, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-muted);
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-sub);
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--accent-gold);
    }

    .nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* Dashboard Page */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .kpi-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .map-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .map-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .breadcrumb-link {
      color: var(--accent-gold);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .map-viewport {
      width: 100%;
      height: 360px;
      background: var(--bg-base);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm);
      position: relative;
      overflow: hidden;
    }

    #map-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .region-path {
      stroke: var(--border-muted);
      stroke-width: 0.7px;
      cursor: pointer;
      transition: fill 0.2s, stroke 0.2s;
    }

    .region-path:hover {
      stroke: var(--accent-gold);
      stroke-width: 1.3px;
    }

    .region-path.selected {
      stroke: var(--accent-gold);
      stroke-width: 1.8px;
    }

    .map-tooltip {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(14, 15, 26, 0.92);
      border: 1px solid var(--accent-gold);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      display: none;
    }

    .map-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-sub);
      flex-wrap: wrap;
      gap: 6px;
    }

    .legend-swatches {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-swatch {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      border: 1px solid var(--border-muted);
    }

    .map-loading {
      position: absolute;
      inset: 0;
      background: rgba(14, 15, 26, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--accent-gold);
    }

    /* Search & Filter (List Page) */
    .filter-section {
      margin-bottom: 14px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-input {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text-main);
      font-size: 14px;
    }

    .search-input::placeholder {
      color: var(--text-sub);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-chip {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      color: var(--text-sub);
      cursor: pointer;
    }

    .tab-chip.active {
      background: var(--accent-plum);
      border-color: var(--accent-gold);
      color: #FFF;
    }

    .active-area-banner {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: rgba(122, 62, 90, 0.28);
      border: 1px solid var(--accent-plum);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      font-size: 13px;
    }

    /* Sake Grid */
    .sake-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 600px) {
      .sake-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .sake-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }

    .sake-card:hover {
      border-color: var(--accent-gold);
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--bg-base);
      position: relative;
      overflow: hidden;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-area-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(122, 62, 90, 0.92);
      border: 1px solid var(--accent-gold);
      color: #FFF;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .card-grade {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.04em;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-brewery {
      font-size: 11px;
      color: var(--text-sub);
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
      padding-top: 4px;
    }

    .mini-tag {
      font-size: 10px;
      background: var(--bg-base);
      border: 1px solid var(--border-muted);
      color: var(--text-sub);
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(14, 15, 26, 0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      background: var(--bg-surface);
      border: 1px solid var(--accent-gold);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-muted);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    /* Detail View */
    .detail-images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .detail-images img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      background: var(--bg-base);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm);
    }

    .detail-location-box {
      background: var(--bg-base);
      border: 1px solid var(--accent-plum);
      border-left: 4px solid var(--accent-gold);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .detail-location-label {
      font-size: 11px;
      color: var(--text-sub);
    }

    .detail-location-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .spec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .spec-table th, .spec-table td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border-muted);
      text-align: left;
    }

    .spec-table th {
      width: 34%;
      color: var(--text-sub);
      font-weight: 600;
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 4px;
    }

    /* Form */
    .form-group {
      margin-bottom: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      color: var(--text-main);
      font-size: 14px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .tag-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-option {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-muted);
      background: var(--bg-base);
      color: var(--text-sub);
      cursor: pointer;
    }

    .tag-option.selected {
      background: var(--accent-plum);
      border-color: var(--accent-gold);
      color: #FFF;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">酒</div>
    <h1>酒日記</h1>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="openModal('settings-modal')">設定</button>
    <button class="btn btn-primary" onclick="openAddModal()">＋ 記録</button>
  </div>
</header>

<div class="container">
  <!-- ページ1：日本酒一覧（コレクション） -->
  <main id="view-list" class="view-section active">
    <section class="filter-section">
      <div class="search-row">
        <input type="text" id="search-input" class="search-input" placeholder="銘柄・酒蔵・都道府県・市区町村・酒米で検索..." oninput="renderList()">
      </div>
      <div class="tabs" id="grade-tabs">
        <button class="tab-chip active" data-grade="ALL" onclick="selectGrade('ALL', this)">すべて</button>
        <button class="tab-chip" data-grade="純米大吟醸" onclick="selectGrade('純米大吟醸', this)">純米大吟醸</button>
        <button class="tab-chip" data-grade="純米吟醸" onclick="selectGrade('純米吟醸', this)">純米吟醸</button>
        <button class="tab-chip" data-grade="純米" onclick="selectGrade('純米', this)">純米・特別純米</button>
        <button class="tab-chip" data-grade="本醸造・その他" onclick="selectGrade('本醸造・その他', this)">本醸造・その他</button>
      </div>
    </section>

    <!-- エリア絞り込み中バナー -->
    <div class="active-area-banner" id="active-area-banner">
      <span id="active-area-label">絞り込み中: </span>
      <button class="btn" style="padding:3px 8px; font-size:11px;" onclick="clearAreaFilter()">解除</button>
    </div>

    <!-- 日本酒一覧グリッド -->
    <section class="sake-grid" id="sake-grid"></section>
  </main>

  <!-- ページ2：ダッシュボード（日本地図 → 県・市区町村） -->
  <section id="view-dashboard" class="view-section">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label" id="kpi-area-label">都道府県制覇数</div>
        <div class="kpi-value" id="stat-areas">0 / 47</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label" id="kpi-total-label">累計記録本数</div>
        <div class="kpi-value" id="stat-total">0 本</div>
      </div>
    </div>

    <div class="map-card">
      <div class="map-header">
        <div class="map-breadcrumb" id="map-breadcrumb">
          <span>日本全国（都道府県別）</span>
        </div>
        <button class="btn" id="btn-filter-from-map" style="padding:4px 10px; font-size:12px; display:none;" onclick="goToListWithCurrentArea()">この地域の酒一覧を見る &rsaquo;</button>
      </div>

      <div class="map-viewport" id="map-viewport">
        <svg id="map-svg"></svg>
        <div class="map-tooltip" id="map-tooltip"></div>
        <div class="map-loading" id="map-loading">地図データを読み込み中...</div>
      </div>

      <div class="map-legend">
        <span>※都道府県をタップで市区町村へ拡大</span>
        <div class="legend-swatches">
          <div class="legend-item"><span class="legend-swatch" style="background:#1A2B3A"></span>0</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#3C4554"></span>1</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#7A3E5A"></span>2〜3</div>
          <div class="legend-item"><span class="legend-swatch" style="background:#C9A36A"></span>4+</div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ボトムナビゲーション（一覧 / ダッシュボード 切り替え） -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-list" onclick="switchPage('list')">
    <span class="nav-icon">🍶</span>
    <span>一覧</span>
  </button>
  <button class="nav-item" id="nav-dashboard" onclick="switchPage('dashboard')">
    <span class="nav-icon">🗾</span>
    <span>ダッシュボード</span>
  </button>
</nav>

<!-- 詳細モーダル（編集・削除ボタン付き） -->
<div class="modal-backdrop" id="detail-modal" onclick="closeModalOnBackdrop(event, 'detail-modal')">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title" id="detail-title">銘柄詳細</div>
      <button class="close-btn" onclick="closeModal('detail-modal')">&times;</button>
    </div>
    <div id="detail-content"></div>
  </div>
</div>

<!-- 新規登録・編集兼用モーダル -->
<div class="modal-backdrop" id="add-modal" onclick="closeModalOnBackdrop(event, 'add-modal')">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title" id="form-modal-title">新しい日本酒を記録</div>
      <button class="close-btn" onclick="closeModal('add-modal')">&times;</button>
    </div>
    <form id="add-form" onsubmit="submitSake(event)">
      <input type="hidden" id="edit-id" value="">

      <!-- JSON一括入力エリア（新規登録時のみ表示） -->
      <div id="json-paste-box" class="form-group" style="background: rgba(201, 163, 106, 0.08); border: 1px dashed var(--accent-gold); padding: 10px; border-radius: var(--radius-sm);">
        <label class="form-label" style="color: var(--accent-gold);">JSONから自動入力（Geminiで生成したJSONを貼付）</label>
        <textarea id="json-paste-input" class="form-control" rows="3" placeholder='{"name": "本まぐろ 純米吟醸", ...}' style="font-size: 12px; font-family: monospace; margin-bottom: 6px;"></textarea>
        <button type="button" class="btn btn-gold" style="width: 100%; justify-content: center; padding: 6px; font-size: 12px;" onclick="applyJsonToForm()">JSONの内容をフォームに反映</button>
      </div>

      <div class="form-group">
        <label class="form-label" id="photo-input-label">ラベル写真（表・裏 最大2枚）</label>
        <input type="file" id="sake-photos" class="form-control" accept="image/*" multiple>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">銘柄名 *</label>
          <input type="text" id="f-name" class="form-control" placeholder="例: 獺祭 磨き二割三分" required>
        </div>
        <div class="form-group">
          <label class="form-label">特定名称 *</label>
          <select id="f-grade" class="form-control" required>
            <option value="純米大吟醸">純米大吟醸</option>
            <option value="純米吟醸">純米吟醸</option>
            <option value="特別純米">特別純米</option>
            <option value="純米酒">純米酒</option>
            <option value="大吟醸">大吟醸</option>
            <option value="吟醸">吟醸</option>

  </div>
</div>

<script>
  // 47都道府県コードマスター（JIS X 0401）
  const PREFECTURES = [
    { code: "01", name: "北海道" }, { code: "02", name: "青森県" }, { code: "03", name: "岩手県" },
    { code: "04", name: "宮城県" }, { code: "05", name: "秋田県" }, { code: "06", name: "山形県" },
    { code: "07", name: "福島県" }, { code: "08", name: "茨城県" }, { code: "09", name: "栃木県" },
    { code: "10", name: "群馬県" }, { code: "11", name: "埼玉県" }, { code: "12", name: "千葉県" },
    { code: "13", name: "東京都" }, { code: "14", name: "神奈川県" }, { code: "15", name: "新潟県" },
    { code: "16", name: "富山県" }, { code: "17", name: "石川県" }, { code: "18", name: "福井県" },
    { code: "19", name: "山梨県" }, { code: "20", name: "長野県" }, { code: "21", name: "岐阜県" },
    { code: "22", name: "静岡県" }, { code: "23", name: "愛知県" }, { code: "24", name: "三重県" },
    { code: "25", name: "滋賀県" }, { code: "26", name: "京都府" }, { code: "27", name: "大阪府" },
    { code: "28", name: "兵庫県" }, { code: "29", name: "奈良県" }, { code: "30", name: "和歌山県" },
    { code: "31", name: "鳥取県" }, { code: "32", name: "島根県" }, { code: "33", name: "岡山県" },
    { code: "34", name: "広島県" }, { code: "35", name: "山口県" }, { code: "36", name: "徳島県" },
    { code: "37", name: "香川県" }, { code: "38", name: "愛媛県" }, { code: "39", name: "高知県" },
    { code: "40", name: "福岡県" }, { code: "41", name: "佐賀県" }, { code: "42", name: "長崎県" },
    { code: "43", name: "熊本県" }, { code: "44", name: "大分県" }, { code: "45", name: "宮崎県" },
    { code: "46", name: "鹿児島県" }, { code: "47", name: "沖縄県" }
  ];

  // GeoJSONデータソース
  const JAPAN_PREF_GEOJSON_URL = "https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson";
  const CITY_GEOJSON_BASE_URL = "https://raw.githubusercontent.com/niiyz/JapanCityGeoJson/master/geojson/prefectures";

  // 初期サンプルデータ
  const SAMPLE_SAKES = [
    {
      id: "sake-001",
      name: "獺祭 無濾過純米大吟醸 磨き二割三分",
      grade: "純米大吟醸",
      brewery: "旭酒造",
      prefecture: "山口県",
      city: "岩国市",
      rice: "山田錦",
      polishing: "23%",
      tags: ["無濾過", "生酒"],
      temp: "冷酒",
      date: "2026-09-30",
      shop: "公式予約",
      notes: "華やかな吟醸香と透明感のある甘み。",
      images: []
    },
    {
      id: "sake-002",
      name: "今代司 純米大吟醸",
      grade: "純米大吟醸",
      brewery: "今代司酒造",
      prefecture: "新潟県",
      city: "新潟市中央区",
      rice: "五百万石",
      polishing: "50%",
      tags: ["火入れ"],
      temp: "冷酒",
      date: "2026-02-13",
      shop: "今代司酒造 直売店",
      notes: "酒蔵見学にて試飲・購入。スッキリとしたキレのある味わい。",
      images: []
    }
  ];

  // アプリ状態
  let sakeList = [];
  let currentPage = "list"; // "list" | "dashboard"
  let currentGrade = "ALL";
  let mapLevel = "japan";   // "japan" | "prefecture"
  let selectedPrefecture = null;
  let selectedCity = null;

  // GeoJSONキャッシュ
  let japanGeoCache = null;
  const cityGeoCache = {};

  // 初期化
  document.addEventListener("DOMContentLoaded", async () => {
    populatePrefectureSelect();
    loadSettingsToForm();
    document.getElementById("f-date").valueAsDate = new Date();
    await loadSakeData();
    renderList();
  });

  // ページ切り替え（一覧 ⇔ ダッシュボード）
  async function switchPage(page) {
    currentPage = page;
    document.getElementById("view-list").classList.toggle("active", page === "list");
    document.getElementById("view-dashboard").classList.toggle("active", page === "dashboard");
    document.getElementById("nav-list").classList.toggle("active", page === "list");
    document.getElementById("nav-dashboard").classList.toggle("active", page === "dashboard");

    if (page === "dashboard") {
      if (mapLevel === "prefecture" && selectedPrefecture) {
        await renderPrefectureMap(selectedPrefecture, selectedCity);
      } else {
        await renderJapanMap();
      }
    } else {
      renderList();
    }
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function populatePrefectureSelect() {
    const sel = document.getElementById("f-prefecture");
    PREFECTURES.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.name;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
  }

  async function loadSakeData() {
    try {
      const res = await fetch(`data/sakes.json?t=${Date.now()}`);
      if (res.ok) {
        const data = await res.json();
        sakeList = Array.isArray(data) ? data : SAMPLE_SAKES;
      } else {
        sakeList = SAMPLE_SAKES;
      }
    } catch (e) {
      sakeList = SAMPLE_SAKES;
    }
  }

  function getHeatmapColor(count) {
    if (!count || count === 0) return "#1A2B3A";
    if (count === 1) return "#3C4554";
    if (count <= 3) return "#7A3E5A";
    return "#C9A36A";
  }

  // ダッシュボード Step 1: 日本全国（都道府県別）マップ描画
  async function renderJapanMap() {
    mapLevel = "japan";
    selectedPrefecture = null;
    selectedCity = null;
    updateBreadcrumbAndBanner();

    const loading = document.getElementById("map-loading");
    loading.style.display = "flex";

    try {
      if (!japanGeoCache) {
        const res = await fetch(JAPAN_PREF_GEOJSON_URL);
        japanGeoCache = await res.json();
      }

      const counts = {};
      sakeList.forEach(s => {
        counts[s.prefecture] = (counts[s.prefecture] || 0) + 1;
      });

      const conqueredCount = Object.keys(counts).length;
      document.getElementById("kpi-area-label").textContent = "都道府県制覇数";
      document.getElementById("stat-areas").textContent = `${conqueredCount} / 47`;
      document.getElementById("kpi-total-label").textContent = "累計記録本数";
      document.getElementById("stat-total").textContent = `${sakeList.length} 本`;

      drawGeoJsonMap(japanGeoCache, (feature) => {
        const rawName = feature.properties.nam_ja || feature.properties.name || "";
        const prefObj = PREFECTURES.find(p => rawName.includes(p.name.replace(/[都府県]$/, "")) || p.name === rawName);
        return prefObj ? prefObj.name : rawName;
      }, counts, (prefName) => {
        renderPrefectureMap(prefName);
      });
    } catch (err) {
      console.error("Japan Map Load Error:", err);
    } finally {
      loading.style.display = "none";
    }
  }

  // ダッシュボード Step 2: 都道府県の市区町村マップへドリルダウン
  async function renderPrefectureMap(prefName, initialCity = null) {
    const prefObj = PREFECTURES.find(p => p.name === prefName);
    if (!prefObj) return;

    mapLevel = "prefecture";
    selectedPrefecture = prefName;
    selectedCity = initialCity;
    updateBreadcrumbAndBanner();

    const loading = document.getElementById("map-loading");
    loading.style.display = "flex";

    try {
      if (!cityGeoCache[prefObj.code]) {
        const url = `${CITY_GEOJSON_BASE_URL}/${prefObj.code}.json`;
        const res = await fetch(url);
        cityGeoCache[prefObj.code] = await res.json();
      }

      const prefSakes = sakeList.filter(s => s.prefecture === prefName);
      const cityCounts = {};
      prefSakes.forEach(s => {
        cityCounts[s.city] = (cityCounts[s.city] || 0) + 1;
      });

      document.getElementById("kpi-area-label").textContent = `${prefName} 制覇市区町村`;
      document.getElementById("stat-areas").textContent = `${Object.keys(cityCounts).length} 地域`;
      document.getElementById("kpi-total-label").textContent = `${prefName} 記録本数`;
      document.getElementById("stat-total").textContent = `${prefSakes.length} 本`;

      drawGeoJsonMap(cityGeoCache[prefObj.code], (feature) => {
        const p = feature.properties;
        const city = p.N03_003 || "";
        const ward = p.N03_004 || "";
        if (city && ward && city !== ward) return `${city}${ward}`;
        return ward || city || p.name || "不明";
      }, cityCounts, (cityName) => {
        selectedCity = (selectedCity === cityName) ? null : cityName;
        updateBreadcrumbAndBanner();
        highlightSelectedCity();
      });

      if (selectedCity) highlightSelectedCity();
    } catch (err) {
      console.error("City Map Load Error:", err);
    } finally {
      loading.style.display = "none";
    }
  }

  function drawGeoJsonMap(geoData, getNameFn, countsMap, onClickFn) {
    const viewport = document.getElementById("map-viewport");
    const width = viewport.clientWidth || 360;
    const height = viewport.clientHeight || 360;
    const tooltip = document.getElementById("map-tooltip");

    const svg = d3.select("#map-svg");
    svg.selectAll("*").remove();

    const g = svg.append("g");

    const zoom = d3.zoom()
      .scaleExtent([1, 8])
      .on("zoom", (event) => {
        g.attr("transform", event.transform);
      });
    svg.call(zoom);

    const projection = d3.geoMercator().fitExtent([[14, 14], [width - 14, height - 14]], geoData);
    const pathGenerator = d3.geoPath().projection(projection);

    g.selectAll("path")
      .data(geoData.features)
      .enter()
      .append("path")
      .attr("d", pathGenerator)
      .attr("class", "region-path")
      .attr("data-name", d => getNameFn(d))
      .attr("fill", d => {
        const name = getNameFn(d);
        return getHeatmapColor(countsMap[name] || 0);
      })
      .on("mouseover", function(event, d) {
        const name = getNameFn(d);
        const cnt = countsMap[name] || 0;
        tooltip.style.display = "block";
        tooltip.innerHTML = `<strong>${name}</strong>：${cnt}本`;
      })
      .on("mouseout", function() {
        tooltip.style.display = "none";
      })
      .on("click", function(event, d) {
        const name = getNameFn(d);
        onClickFn(name);
      });
  }

  function highlightSelectedCity() {
    d3.selectAll(".region-path").classed("selected", function() {
      return this.getAttribute("data-name") === selectedCity;
    });
  }

  function clearAreaFilter() {
    mapLevel = "japan";
    selectedPrefecture = null;
    selectedCity = null;
    updateBreadcrumbAndBanner();
    renderList();
  }

  function goToListWithCurrentArea() {
    switchPage("list");
  }

  function updateBreadcrumbAndBanner() {
    const bc = document.getElementById("map-breadcrumb");
    const banner = document.getElementById("active-area-banner");
    const bannerLabel = document.getElementById("active-area-label");
    const mapActionBtn = document.getElementById("btn-filter-from-map");

    if (mapLevel === "japan" || !selectedPrefecture) {
      bc.innerHTML = `<span>日本全国（都道府県別）</span>`;
      banner.style.display = "none";
      mapActionBtn.style.display = "none";
    } else {
      bc.innerHTML = `
        <span class="breadcrumb-link" onclick="renderJapanMap()">日本全国</span>
        <span style="color:var(--text-sub)">&rsaquo;</span>
        <span>${selectedPrefecture}${selectedCity ? " " + selectedCity : ""}</span>
      `;
      banner.style.display = "flex";
      bannerLabel.textContent = `エリア絞り込み: ${selectedPrefecture}${selectedCity ? " / " + selectedCity : "（全域）"}`;
      mapActionBtn.style.display = "inline-flex";
    }
  }

  // 特定名称タブ選択
  function selectGrade(grade, btnEl) {
    currentGrade = grade;
    document.querySelectorAll(".tab-chip").forEach(el => el.classList.remove("active"));
    btnEl.classList.add("active");
    renderList();
  }

  // 一覧カード描画
  function renderList() {
    const grid = document.getElementById("sake-grid");
    const keyword = document.getElementById("search-input").value.trim().toLowerCase();

    const filtered = sakeList.filter(item => {
      if (selectedPrefecture && item.prefecture !== selectedPrefecture) return false;
      if (selectedCity && item.city !== selectedCity) return false;

      if (currentGrade !== "ALL") {
        if (currentGrade === "純米" && !["純米酒", "特別純米", "純米"].includes(item.grade)) return false;
        if (currentGrade === "本醸造・その他" && !["大吟醸", "吟醸", "特別本醸造", "本醸造", "普通酒・その他"].includes(item.grade)) return false;
        if (["純米大吟醸", "純米吟醸"].includes(currentGrade) && item.grade !== currentGrade) return false;
      }

      if (keyword) {
        const target = [
          item.name, item.brewery, item.prefecture, item.city,
          item.rice, item.grade, ...(item.tags || [])
        ].join(" ").toLowerCase();
        if (!target.includes(keyword)) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:32px; color:var(--text-sub); font-size:13px;">該当する日本酒の記録がありません</div>`;
      return;
    }

    grid.innerHTML = filtered.map(item => {
      const thumb = (item.images && item.images.length > 0)
        ? item.images[0]
        : `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400"><rect width="300" height="400" fill="%230E0F1A"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23C9A36A" font-size="22" font-family="sans-serif">${encodeURIComponent(item.name.slice(0, 6))}</text></svg>`;

      const tagsHtml = (item.tags || []).slice(0, 3).map(t => `<span class="mini-tag">#${t}</span>`).join("");

      return `
        <article class="sake-card" onclick="openDetail('${item.id}')">
          <div class="card-img-wrap">
            <img src="${thumb}" alt="${item.name}" loading="lazy">
            <span class="card-area-badge">${item.prefecture}・${item.city}</span>
          </div>
          <div class="card-body">
            <div class="card-grade">${item.grade}</div>
            <h2 class="card-title">${item.name}</h2>
            <div class="card-brewery">${item.brewery}</div>
            <div class="card-tags">${tagsHtml}</div>
          </div>
        </article>
      `;
    }).join("");
  }

  // 詳細モーダル表示（編集・削除ボタン付き）
  function openDetail(id) {
    const item = sakeList.find(s => s.id === id);
    if (!item) return;

    document.getElementById("detail-title").textContent = item.name;

    const imagesHtml = (item.images && item.images.length > 0)
      ? `<div class="detail-images">${item.images.map(src => `<img src="${src}" alt="${item.name}">`).join("")}</div>`
      : "";

    const tagsText = (item.tags && item.tags.length > 0) ? item.tags.map(t => `#${t}`).join(" ") : "—";

    document.getElementById("detail-content").innerHTML = `
      ${imagesHtml}
      <div class="detail-location-box" onclick="jumpToDashboardLocation('${item.prefecture}', '${item.city}')">
        <div>
          <div class="detail-location-label">産地（タップで市区町村マップへ移動）</div>
          <div class="detail-location-value">${item.prefecture} ${item.city}</div>
        </div>
        <span style="color:var(--accent-gold); font-size:13px;">地図で見る &rsaquo;</span>
      </div>
      <table class="spec-table">
        <tr><th>特定名称</th><td style="color:var(--accent-gold); font-weight:700;">${item.grade}</td></tr>
        <tr><th>酒蔵</th><td>${item.brewery}</td></tr>
        <tr><th>都道府県</th><td>${item.prefecture}</td></tr>
        <tr><th>市区町村</th><td>${item.city}</td></tr>
        <tr><th>酒米 / 精米歩合</th><td>${item.rice || "—"} ${item.polishing ? `/ ${item.polishing}` : ""}</td></tr>
        <tr><th>製法・特徴</th><td>${tagsText}</td></tr>
        <tr><th>飲んだ温度帯</th><td>${item.temp || "—"}</td></tr>
        <tr><th>購入日 / 飲用日</th><td>${item.date || "—"}</td></tr>
        <tr><th>購入店 / 場所</th><td>${item.shop || "—"}</td></tr>
        <tr><th>メモ</th><td>${item.notes || "—"}</td></tr>
      </table>
      <div class="detail-actions">
        <button type="button" class="btn" onclick="openEditModal('${item.id}')">✏️ 編集</button>
        <button type="button" class="btn btn-danger" onclick="deleteSake('${item.id}')">🗑️ 削除</button>
      </div>
    `;

    openModal("detail-modal");
  }

  async function jumpToDashboardLocation(prefecture, city) {
    closeModal("detail-modal");
    mapLevel = "prefecture";
    selectedPrefecture = prefecture;
    selectedCity = city;
    await switchPage("dashboard");
  }

  // 新規登録モーダルを開く
  function openAddModal() {
    document.getElementById("add-form").reset();
    document.getElementById("edit-id").value = "";
    document.getElementById("form-modal-title").textContent = "新しい日本酒を記録";
    document.getElementById("submit-btn").textContent = "GitHubへ保存して登録";
    document.getElementById("json-paste-box").style.display = "block";
    document.getElementById("photo-input-label").textContent = "ラベル写真（表・裏 最大2枚）";
    document.getElementById("f-date").valueAsDate = new Date();
    document.querySelectorAll("#tag-selector .tag-option.selected").forEach(el => el.classList.remove("selected"));
    openModal("add-modal");
  }

  // 編集モーダルを開く（既存データをセット）
  function openEditModal(id) {
    const item = sakeList.find(s => s.id === id);
    if (!item) return;

    closeModal("detail-modal");
    document.getElementById("add-form").reset();
    document.getElementById("edit-id").value = item.id;
    document.getElementById("form-modal-title").textContent = "記録を編集";
    document.getElementById("submit-btn").textContent = "変更をGitHubへ保存";
    document.getElementById("json-paste-box").style.display = "none";
    document.getElementById("photo-input-label").textContent = "ラベル写真を追加・差し替え（未選択なら既存の写真を維持）";

    document.getElementById("f-name").value = item.name || "";
    document.getElementById("f-grade").value = item.grade || "純米大吟醸";
    document.getElementById("f-brewery").value = item.brewery || "";
    document.getElementById("f-prefecture").value = item.prefecture || "東京都";
    document.getElementById("f-city").value = item.city || "";
    document.getElementById("f-rice").value = item.rice || "";
    document.getElementById("f-polishing").value = item.polishing || "";
    document.getElementById("f-temp").value = item.temp || "冷酒";
    document.getElementById("f-date").value = item.date || "";
    document.getElementById("f-shop").value = item.shop || "";
    document.getElementById("f-notes").value = item.notes || "";

    const tags = Array.isArray(item.tags) ? item.tags : [];
    document.querySelectorAll("#tag-selector .tag-option").forEach(el => {
      el.classList.toggle("selected", tags.includes(el.textContent.trim()));
    });

    openModal("add-modal");
  }

  // レコード削除処理（GitHub API 経由で data/sakes.json と画像ファイルを削除）
  async function deleteSake(id) {
    const item = sakeList.find(s => s.id === id);
    if (!item) return;

    if (!confirm(`「${item.name}」の記録を削除しますか？\n（GitHub上のデータも削除されます）`)) {
      return;
    }

    const owner = localStorage.getItem("sake_gh_owner");
    const repo = localStorage.getItem("sake_gh_repo");
    const token = localStorage.getItem("sake_gh_token");

    if (!owner || !repo || !token) {
      alert("先に右上の「設定」からGitHub Owner / Repo / Tokenを入力してください。");
      openModal("settings-modal");
      return;
    }

    try {
      // 1. 最新の data/sakes.json を取得
      const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data/sakes.json`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (!getRes.ok) throw new Error("data/sakes.json の取得に失敗しました");

      const jsonMeta = await getRes.json();
      const fileSha = jsonMeta.sha;
      const decoded = decodeURIComponent(escape(atob(jsonMeta.content.replace(/\n/g, ""))));
      const currentData = JSON.parse(decoded);

      // 2. 該当IDを除外
      const updatedData = currentData.filter(s => s.id !== id);
      const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(updatedData, null, 2))));

      await githubPutFile(owner, repo, token, "data/sakes.json", updatedContentBase64, `Delete sake: ${item.name}`, fileSha);

      // 3. 紐づく画像ファイルがあればリポジトリから削除（存在しなくてもエラーにしない）
      if (Array.isArray(item.images)) {
        for (const imgPath of item.images) {
          if (imgPath.startsWith("images/")) {
            await githubDeleteFile(owner, repo, token, imgPath, `Delete image ${imgPath}`);
          }
        }
      }

      sakeList = updatedData;
      closeModal("detail-modal");
      renderList();
      if (currentPage === "dashboard") {
        if (mapLevel === "prefecture" && selectedPrefecture) {
          await renderPrefectureMap(selectedPrefecture, selectedCity);
        } else {
          await renderJapanMap();
        }
      }
      alert("記録を削除しました。");
    } catch (err) {
      console.error(err);
      alert("削除に失敗しました: " + err.message);
    }
  }

  // 貼り付けたJSONをフォームの各項目へ自動反映
  function applyJsonToForm() {
    const raw = document.getElementById("json-paste-input").value.trim();
    if (!raw) {
      alert("JSONテキストを貼り付けてください。");
      return;
    }

    try {
      const cleaned = raw.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
      const data = JSON.parse(cleaned);

      if (data.name) document.getElementById("f-name").value = data.name;
      if (data.grade) document.getElementById("f-grade").value = data.grade;
      if (data.brewery) document.getElementById("f-brewery").value = data.brewery;
      if (data.prefecture) document.getElementById("f-prefecture").value = data.prefecture;
      if (data.city) document.getElementById("f-city").value = data.city;
      if (data.rice) document.getElementById("f-rice").value = data.rice;
      if (data.polishing) document.getElementById("f-polishing").value = data.polishing;
      if (data.temp) document.getElementById("f-temp").value = data.temp;
      if (data.date) document.getElementById("f-date").value = data.date;
      if (data.shop) document.getElementById("f-shop").value = data.shop;
      if (data.notes) document.getElementById("f-notes").value = data.notes;

      const tags = Array.isArray(data.tags) ? data.tags : [];
      document.querySelectorAll("#tag-selector .tag-option").forEach(el => {
        el.classList.toggle("selected", tags.includes(el.textContent.trim()));
      });

      alert("JSONの内容をフォームに反映しました！ラベル写真を選択して登録してください。");
    } catch (err) {
      alert("JSONの形式が正しくありません。括弧の過不足などを確認してください。\nエラー: " + err.message);
    }
  }

  function toggleTag(el) {
    el.classList.toggle("selected");
  }

  function openModal(id) {
    document.getElementById(id).classList.add("open");
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove("open");
  }

  function closeModalOnBackdrop(e, id) {
    if (e.target.id === id) closeModal(id);
  }

  function saveSettings() {
    localStorage.setItem("sake_gh_owner", document.getElementById("cfg-owner").value.trim());
    localStorage.setItem("sake_gh_repo", document.getElementById("cfg-repo").value.trim());
    localStorage.setItem("sake_gh_token", document.getElementById("cfg-token").value.trim());
    alert("設定を保存しました。");
    closeModal("settings-modal");
  }

  function loadSettingsToForm() {
    document.getElementById("cfg-owner").value = localStorage.getItem("sake_gh_owner") || "";
    document.getElementById("cfg-repo").value = localStorage.getItem("sake_gh_repo") || "sake-log";
    document.getElementById("cfg-token").value = localStorage.getItem("sake_gh_token") || "";
  }

  // 新規保存 ＆ 編集上書き保存（GitHub API 経由）
  async function submitSake(e) {
    e.preventDefault();
    const owner = localStorage.getItem("sake_gh_owner");
    const repo = localStorage.getItem("sake_gh_repo");
    const token = localStorage.getItem("sake_gh_token");

    if (!owner || !repo || !token) {
      alert("先に右上の「設定」からGitHub Owner / Repo / Tokenを入力してください。");
      openModal("settings-modal");
      return;
    }

    const btn = document.getElementById("submit-btn");
    const editId = document.getElementById("edit-id").value;
    const isEdit = Boolean(editId);

    btn.disabled = true;
    btn.textContent = isEdit ? "更新中..." : "アップロード中...";

    try {
      const files = Array.from(document.getElementById("sake-photos").files).slice(0, 2);
      const id = isEdit ? editId : `sake-${Date.now()}`;
      const uploadedPaths = [];

      // 1. 新しい画像が選択された場合のみアップロード
      for (let i = 0; i < files.length; i++) {
        const base64 = await fileToBase64(files[i]);
        const ext = files[i].name.split(".").pop() || "jpg";
        const path = `images/${id}_${Date.now()}_${i + 1}.${ext}`;
        await githubPutFile(owner, repo, token, path, base64, `Add sake image ${path}`);
        uploadedPaths.push(path);
      }

      // 2. 既存 sakes.json の取得
      let currentData = [];
      let fileSha = null;
      const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data/sakes.json`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (getRes.ok) {
        const jsonMeta = await getRes.json();
        fileSha = jsonMeta.sha;
        const decoded = decodeURIComponent(escape(atob(jsonMeta.content.replace(/\n/g, ""))));
        currentData = JSON.parse(decoded);
      }

      const selectedTags = Array.from(document.querySelectorAll("#tag-selector .tag-option.selected"))
        .map(el => el.textContent.trim());

      const existingItem = isEdit ? currentData.find(s => s.id === editId) : null;
      const finalImages = uploadedPaths.length > 0
        ? uploadedPaths
        : (existingItem && Array.isArray(existingItem.images) ? existingItem.images : []);

      const entryData = {
        id,
        name: document.getElementById("f-name").value.trim(),
        grade: document.getElementById("f-grade").value,
        brewery: document.getElementById("f-brewery").value.trim(),
        prefecture: document.getElementById("f-prefecture").value,
        city: document.getElementById("f-city").value.trim(),
        rice: document.getElementById("f-rice").value.trim(),
        polishing: document.getElementById("f-polishing").value.trim(),
        tags: selectedTags,
        temp: document.getElementById("f-temp").value,
        date: document.getElementById("f-date").value,
        shop: document.getElementById("f-shop").value.trim(),
        notes: document.getElementById("f-notes").value.trim(),
        images: finalImages
      };

      if (isEdit) {
        const idx = currentData.findIndex(s => s.id === editId);
        if (idx !== -1) {
          currentData[idx] = entryData;
        } else {
          currentData.unshift(entryData);
        }
      } else {
        currentData.unshift(entryData);
      }

      // 3. sakes.json 更新コミット
      const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 2))));
      await githubPutFile(
        owner, repo, token,
        "data/sakes.json",
        updatedContentBase64,
        `${isEdit ? "Update" : "Add"} sake: ${entryData.name}`,
        fileSha
      );

      sakeList = currentData;
      closeModal("add-modal");
      document.getElementById("add-form").reset();
      document.querySelectorAll("#tag-selector .tag-option.selected").forEach(el => el.classList.remove("selected"));

      renderList();
      if (currentPage === "dashboard") {
        if (mapLevel === "prefecture" && selectedPrefecture) {
          await renderPrefectureMap(selectedPrefecture, selectedCity);
        } else {
          await renderJapanMap();
        }
      }
      alert(isEdit ? "記録を更新しました！" : "日本酒の記録をGitHubへ保存しました！");
    } catch (err) {
      console.error(err);
      alert("保存に失敗しました: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = isEdit ? "変更をGitHubへ保存" : "GitHubへ保存して登録";
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function githubPutFile(owner, repo, token, path, contentBase64, message, sha = null) {
    const body = { message, content: contentBase64 };
    if (sha) body.sha = sha;

    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData.message || "GitHub API Error");
    }
    return res.json();
  }

  async function githubDeleteFile(owner, repo, token, path, message) {
    try {
      const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!getRes.ok) return;
      const meta = await getRes.json();

      await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message, sha: meta.sha })
      });
    } catch (e) {
      console.warn("Image delete skipped:", path, e);
    }
  }
</script>
